name: NexCart CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate Django Configuration & Run Migrations
      env:
        SECRET_KEY: 'ci-testing-secret-key-nexcart'
        DEBUG: 'True'
      run: |
        python NexCart/manage.py check
        python NexCart/manage.py migrate --noinput
